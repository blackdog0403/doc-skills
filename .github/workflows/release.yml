name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write   # required for GitHub OIDC -> AWS role assumption (Bedrock)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags for release-notes generation

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build release ZIPs
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh ${{ steps.version.outputs.VERSION }}

      # Optional: only runs if the repo variable AWS_BEDROCK_ROLE_ARN is set.
      # Without it (or on failure), release notes fall back to the deterministic changelog.
      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_BEDROCK_ROLE_ARN != ''
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BEDROCK_ROLE_ARN }}
          aws-region: us-west-2

      - name: Generate release notes
        env:
          BEDROCK_MODEL_ID: us.anthropic.claude-opus-4-7
          AWS_REGION: us-west-2
        run: |
          chmod +x scripts/gen-release-notes.sh scripts/ai-release-notes.sh
          ./scripts/ai-release-notes.sh "${{ steps.version.outputs.VERSION }}" > release_notes.md
          cat << 'EOF' >> release_notes.md

          ---

          ## 📦 Amazon Quick Desktop Skills

          Download individual skill ZIPs or the all-in-one package.

          ### Installation

          1. Download the ZIP for your skill(s)
          2. Unzip and move the folder to:
             - **Mac**: `~/.quickwork/profiles/federate-prod/skills/`
             - **Windows**: `%USERPROFILE%\.quickwork\profiles\federate-prod\skills\`
          3. Restart Amazon Quick Desktop

          👉 See [INSTALL-QUICK.md](docs/INSTALL-QUICK.md) for detailed instructions (English + 한국어)

          ### Skills included

          | File | Skill | Description |
          |------|-------|-------------|
          | `doc-fact-check-quick-*.zip` | 🔍 Document Fact Checker | Verify claims against AWS official sources |
          | `md-to-docx-quick-*.zip` | 📄 Markdown to DOCX | Convert MD → styled Word (AWS or Amazon narrative style) |
          | `translate-pptx-quick-*.zip` | 🌐 Translate PPTX | Translate presentations between languages |
          | `stop-slop-quick-*.zip` | ✂️ Stop Slop | Remove AI writing patterns from prose |
          | `verity-quick-*.zip` | ✅ Verity | Verify an AI answer's factual grounding, with a trust score |
          | `doc-skills-all-quick-*.zip` | 📦 All Skills | Everything in one package |
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: dist/*
          generate_release_notes: false   # grouped changelog comes from gen-release-notes.sh
          # Mark *-rc*, *-beta*, *-alpha* as pre-release; only stable tags become "latest".
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          make_latest: ${{ !(contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) }}
